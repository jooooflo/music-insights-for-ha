# Music Insights (MI-HA) - example dashboard
#
# How to use:
# 1. In Home Assistant: Settings -> Dashboards -> "+ Add Dashboard" ->
#    "New dashboard from scratch". Give it a title (e.g. "Music Insights").
# 2. Open the new dashboard -> pencil icon (top right, edit mode) ->
#    the ⋮ menu (top right) -> "Edit in YAML" -> replace the content with
#    everything below -> Save.
#
# Entity IDs below match this specific installation (device title
# "Spotify (Flo Ü)"). If you set this up fresh, replace the entity_id
# values with your own - find them under Settings -> Devices & Services ->
# Music Insights (MI-HA) -> the device -> entity list.
title: Music Insights
views:
  - title: Music Insights
    path: music-insights
    icon: mdi:music-box-multiple
    cards:
      - type: markdown
        content: "### ▶️ Currently Playing"

      - type: vertical-stack
        cards:
          - type: tile
            entity: sensor.spotify_flo_ue_currently_playing
            name: Currently playing
            vertical: false
            show_entity_picture: true
            icon: mdi:spotify
          - type: entities
            show_header_toggle: false
            entities:
              - type: attribute
                entity: sensor.spotify_flo_ue_currently_playing
                attribute: album
                name: Album
                icon: mdi:album
              - type: attribute
                entity: sensor.spotify_flo_ue_currently_playing
                attribute: device
                name: Gerät
                icon: mdi:cellphone-link
              - type: attribute
                entity: sensor.spotify_flo_ue_currently_playing
                attribute: is_playing
                name: Spielt gerade
                icon: mdi:play-circle-outline

      - type: markdown
        content: "### 📊 Jahresstatistik"

      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: tile
                entity: sensor.spotify_flo_ue_listening_time_today
                name: Heute
                icon: mdi:clock-outline
              - type: tile
                entity: sensor.spotify_flo_ue_listening_time_this_year
                name: Dieses Jahr
                icon: mdi:calendar-clock
          - type: entities
            show_header_toggle: false
            entities:
              - type: attribute
                entity: sensor.spotify_flo_ue_listening_time_this_year
                attribute: play_count
                name: Wiedergaben
                icon: mdi:counter
              - type: attribute
                entity: sensor.spotify_flo_ue_listening_time_this_year
                attribute: unique_tracks
                name: Unterschiedliche Songs
                icon: mdi:music-note-outline
              - type: attribute
                entity: sensor.spotify_flo_ue_listening_time_this_year
                attribute: unique_artists
                name: Unterschiedliche Artists
                icon: mdi:account-music-outline

      - type: markdown
        content: "### 📅 Diesen Monat"

      - type: vertical-stack
        cards:
          - type: tile
            entity: sensor.garage_spotify_flo_ue_listening_time_this_month
            name: Diesen Monat
            icon: mdi:calendar-month
          - type: entities
            show_header_toggle: false
            entities:
              - type: attribute
                entity: sensor.garage_spotify_flo_ue_listening_time_this_month
                attribute: play_count
                name: Wiedergaben
                icon: mdi:counter
              - type: attribute
                entity: sensor.garage_spotify_flo_ue_listening_time_this_month
                attribute: unique_tracks
                name: Unterschiedliche Songs
                icon: mdi:music-note-outline
              - type: attribute
                entity: sensor.garage_spotify_flo_ue_listening_time_this_month
                attribute: unique_artists
                name: Unterschiedliche Artists
                icon: mdi:account-music-outline
              - type: attribute
                entity: sensor.garage_spotify_flo_ue_listening_time_this_month
                attribute: top_device
                name: Top Gerät
                icon: mdi:cellphone-link
              - type: attribute
                entity: sensor.garage_spotify_flo_ue_listening_time_this_month
                attribute: tageszeit
                name: Meiste Tageszeit
                icon: mdi:clock-time-four-outline

      - type: markdown
        content: "### 🎵 Top Songs"

      - type: grid
        columns: 3
        square: true
        cards:
          - type: tile
            entity: sensor.garage_spotify_flo_ue_top_track_heute
            name: Heute
            vertical: true
            show_entity_picture: true
          - type: tile
            entity: sensor.garage_spotify_flo_ue_top_track_diesen_monat
            name: Diesen Monat
            vertical: true
            show_entity_picture: true
          - type: tile
            entity: sensor.spotify_flo_ue_top_track_short_term
            name: 4 Wochen
            vertical: true
            show_entity_picture: true
          - type: tile
            entity: sensor.garage_spotify_flo_ue_top_track_medium_term
            name: 6 Monate
            vertical: true
            show_entity_picture: true
          - type: tile
            entity: sensor.garage_spotify_flo_ue_top_track_long_term
            name: Gesamt
            vertical: true
            show_entity_picture: true

      - type: markdown
        content: "### 🎤 Top Artists"

      - type: grid
        columns: 3
        square: true
        cards:
          - type: tile
            entity: sensor.garage_spotify_flo_ue_top_artist_heute
            name: Heute
            vertical: true
            show_entity_picture: true
          - type: tile
            entity: sensor.garage_spotify_flo_ue_top_artist_diesen_monat
            name: Diesen Monat
            vertical: true
            show_entity_picture: true
          - type: tile
            entity: sensor.spotify_flo_ue_top_artist_short_term
            name: 4 Wochen
            vertical: true
            show_entity_picture: true
          - type: tile
            entity: sensor.garage_spotify_flo_ue_top_artist_medium_term
            name: 6 Monate
            vertical: true
            show_entity_picture: true
          - type: tile
            entity: sensor.garage_spotify_flo_ue_top_artist_long_term
            name: Gesamt
            vertical: true
            show_entity_picture: true

      - type: markdown
        content: "### 🏆 Rekorde"

      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.garage_spotify_flo_ue_top_device_all_time
            name: Top Gerät (insgesamt)
            icon: mdi:cellphone-link
          - entity: sensor.garage_spotify_flo_ue_top_day
            name: Top Tag
            icon: mdi:calendar-star
          - type: attribute
            entity: sensor.garage_spotify_flo_ue_top_day
            attribute: minutes
            name: Minuten am Top-Tag
            icon: mdi:clock-outline
          - entity: sensor.garage_spotify_flo_ue_top_month
            name: Top Monat
            icon: mdi:calendar-star
          - type: attribute
            entity: sensor.garage_spotify_flo_ue_top_month
            attribute: minutes
            name: Minuten im Top-Monat
            icon: mdi:clock-outline

      - type: markdown
        content: "### 🔧 Diagnose"

      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.spotify_flo_ue_recently_played_sync
            name: Letzter Abgleich
            icon: mdi:sync
